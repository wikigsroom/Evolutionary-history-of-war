server {
    listen 80;
    server_name jyqx-server.sidcloud.cn;
    access_log off;
    error_log /dev/null crit;
    location ^~ /.well-known/acme-challenge/ { root /var/www/epochrush; }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name jyqx-server.sidcloud.cn;
    ssl_certificate /etc/letsencrypt/live/epochrush-public/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/epochrush-public/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:EpochRushTLS:2m;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;

    location = / {
        default_type application/json;
        return 200 '{"service":"Epoch Rush online","version":"0.8.1","privacy":"https://jyqx.sidcloud.cn","bootstrap":"/v1/bootstrap"}\n';
    }
    location = /healthz { return 404; }
    location = /metrics { return 404; }
    location ^~ /admin { return 404; }
    location /v1/ {
        proxy_pass http://127.0.0.1:28187;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
    location / { return 404; }
}
